  <head>
    <meta charset="UTF-8" />

    <!-- TODO: replace northstarpacific.com with your live domain in every URL below -->
    <title>
      North Star Pacific — Build, improve &amp; automate your business technology
    </title>
    <meta
      name="description"
      content="North Star Pacific helps growing businesses build custom apps, modernize old systems, automate operations, sharpen marketing, and put AI to work. Start with a Business Technology Growth Audit."
    />
    <link rel="canonical" href="https://northstarpacific.com/" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="North Star Pacific" />
    <meta
      property="og:title"
      content="Build, improve & automate the technology your business needs to grow"
    />
    <meta
      property="og:description"
      content="Custom apps, app rebuilds, automation, marketing tech, AI, and dashboards for growing businesses. Start with a Growth Audit."

    <meta property="og:image" content="https://northstarpacific.com/og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="North Star Pacific — business technology for growing businesses"
    />
    <meta
      name="twitter:description"
      content="Build, improve, and automate the technology your business needs to grow."
    />
    <meta name="twitter:image" content="https://northstarpacific.com/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "North Star Pacific",
        "description": "Business technology partner for growing businesses: custom apps, app rebuilds, automation, marketing technology, AI tools, dashboards, and integrations.",
        "url": "https://northstarpacific.com/",
        "areaServed": "US",
        "serviceType": [
          "Custom software development",
          "App modernization",
          "Business process automation",
          "Marketing technology",
          "AI tools and assistants",
          "Dashboards and integrations"
        ],
        "makesOffer": {
          "@type": "Offer",
          "name": "Business Technology Growth Audit",
          "price": "1500",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do you only do automation?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. We build custom apps, rebuild and modernize old software, set up marketing and CRM systems, add AI tools, build dashboards and integrations, and automate operations. Automation is one of six things we do."
            }
          },
          {
            "@type": "Question",
            "name": "What if I don’t know what we actually need?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "That’s exactly what the Growth Audit is for. We find the highest-value opportunity in your business before you commit to building anything — and you keep the roadmap either way."
            }
          },
          {
            "@type": "Question",
            "name": "Can you improve an app or system we already have?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We review, redesign, rebuild, modernize, or add features to existing apps, portals, internal tools, dashboards, and workflows — you don’t have to start from scratch."
            }
          },
          {
            "@type": "Question",
            "name": "Do you publish your pricing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We publish starting prices because you deserve clarity up front. Final pricing depends on scope, integrations, data, timeline, and support level — which the audit pins down precisely."
            }
          },
          {
            "@type": "Question",
            "name": "How long does it take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Growth Audit typically takes 5 to 10 business days. Build timelines depend on scope and are confirmed in a written Statement of Work before any work starts."
            }
          },
          {
            "@type": "Question",
            "name": "Is our data safe with you?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We access only what’s needed, review access and data flows before touching sensitive systems, and hand over documentation and ownership of the work. Security is part of how we deliver, not an afterthought."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide ongoing support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Our monthly Technology Partner plans cover maintenance, optimization, reporting, and continued improvements once your system is live."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
