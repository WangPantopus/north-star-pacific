    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "North Star Pacific",
        "description": "AI implementation partner for growing companies — opportunity assessments, workflow automation, custom AI and business software, app upgrades, data integration, and production optimization.",
        "url": "https://north-star-pacific.vercel.app/",
        "areaServed": "US",
        "serviceType": [
          "AI opportunity assessment",
          "AI Quick Build",
          "AI workflow automation",
          "Custom AI software development",
          "Application upgrades",
          "Data and systems integration",
          "AI production implementation and optimization"
        ],
        "makesOffer": {
          "@type": "Offer",
          "name": "AI Opportunity Audit",
          "price": "2500",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do you actually build, or just advise?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We build. The audit produces the plan; the builds produce working systems wired into your product, tools, and data — live in production. If all you want is the plan, the audit stands on its own and the roadmap is yours."
            }
          },
          {
            "@type": "Question",
            "name": "What exactly does the AI Opportunity Audit include?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A map of where AI can move revenue, speed, or cost across your product and operations; the 1–3 highest-leverage opportunities scored by impact and effort; a concrete build plan for the top one with real cost and timeline; an honest buy/build/wait call on each; and a 30- and 90-day roadmap."
            }
          },
          {
            "@type": "Question",
            "name": "What if we'd be better off buying a tool instead of building?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Then that's what we'll tell you. Some problems are solved by an off-the-shelf product, and pretending otherwise would waste your money and our credibility. The buy/build/wait call is the core of the audit — and it's yours whether or not you build with us."
            }
          },
          {
            "@type": "Question",
            "name": "Who actually does the work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "An engineer who's shipped production software at Meta, Apple, and LinkedIn — not a strategy layer that hands the build to someone you've never met. You work directly with the person building your system."
            }
          },
          {
            "@type": "Question",
            "name": "We have an AI prototype that never shipped. Can you finish it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — that's one of the most common situations we see, and one of the fastest paths to production value. The expensive thinking is usually done; what's missing is reliability, integration, and the last mile into real use. That's exactly what we do."
            }
          },
          {
            "@type": "Question",
            "name": "How do you handle our data and security?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your data stays in your systems and your accounts wherever possible; we build inside your stack, not on top of a copy of it. Access is scoped and revocable, sensitive data is handled under whatever compliance constraints you operate in, and we'll tell you plainly when a use case carries risk we think you shouldn't take."
            }
          },
          {
            "@type": "Question",
            "name": "How fast can something be live?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The audit takes days, not months. A focused Quick Build typically ships in weeks. Larger systems are scoped honestly in the audit — with a real timeline, before you commit."
            }
          },
          {
            "@type": "Question",
            "name": "What stack do you work with?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yours. The point is AI wired into the tools, data, and product you already run — CRMs, helpdesks, databases, internal apps, your codebase. If something in your stack genuinely blocks the build, the audit will say so and price the fix."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
