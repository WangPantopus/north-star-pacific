<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E1A" />

    <!-- TODO: swap north-star-pacific.vercel.app for your custom domain when ready -->
    <title>
      North Star Pacific — AI Enablement &amp; Implementation for Growing Companies
    </title>
    <meta
      name="description"
      content="North Star Pacific helps growing companies identify high-value AI opportunities, train teams, automate workflows, modernize systems, and build production AI solutions. Start with an AI Opportunity Audit."
    />
    <link rel="canonical" href="https://north-star-pacific.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="North Star Pacific" />
    <meta
      property="og:title"
      content="Turn AI from scattered experiments into a working part of your business"
    />
    <meta
      property="og:description"
      content="AI opportunity discovery, team enablement, workflow automation, integrations, modernization, and production implementation for growing companies."
    />
    <meta property="og:url" content="https://north-star-pacific.vercel.app/" />
    <meta property="og:image" content="https://north-star-pacific.vercel.app/og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="North Star Pacific — AI enablement and implementation"
    />
    <meta
      name="twitter:description"
      content="Find the right AI opportunities, enable your team, and implement working systems that create measurable business value."
    />
    <meta name="twitter:image" content="https://north-star-pacific.vercel.app/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "North Star Pacific",
        "description": "AI enablement and implementation partner for growing companies, including AI opportunity assessments, team training, workflow automation, custom AI and business software, app modernization, data integration, and production optimization.",
        "url": "https://north-star-pacific.vercel.app/",
        "areaServed": "US",
        "serviceType": [
          "AI opportunity assessment",
          "AI team enablement and training",
          "AI workflow automation",
          "Custom AI software development",
          "Application modernization",
          "Data and systems integration",
          "AI production implementation and optimization"
        ],
        "makesOffer": {
          "@type": "Offer",
          "name": "AI Opportunity Audit",
          "price": "2500",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do you only work on AI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "AI enablement and implementation is our primary focus. We also modernize apps, connect systems, build custom software, improve data access, and automate operations when those capabilities are needed to make AI or another high-value workflow succeed."
            }
          },
          {
            "@type": "Question",
            "name": "What if we do not know where AI belongs in our business?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "That is exactly what the AI Opportunity Audit is for. We review your goals, workflows, tools, data, and current AI usage, then rank the best opportunities and give an honest buy / build / wait recommendation for each priority."
            }
          },
          {
            "@type": "Question",
            "name": "Do you only advise, or do you also build?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We do both. We can identify opportunities, create the roadmap, train your team, configure existing products, integrate your systems, modernize software, and build production AI or custom business tools when off-the-shelf options are not enough."
            }
          },
          {
            "@type": "Question",
            "name": "Can you train our team and improve AI adoption?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We provide role-specific training, approved-tool guidance, practical playbooks, reusable workflows, human-review standards, and rollout support so useful AI practices spread beyond a few early adopters."
            }
          },
          {
            "@type": "Question",
            "name": "Can you improve an app, system, or AI pilot we already have?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We can review, redesign, modernize, integrate, or rebuild existing apps and internal tools. We can also take an AI prototype or pilot through the reliability, data, security, adoption, and measurement work required for production use."
            }
          },
          {
            "@type": "Question",
            "name": "How do you handle data security and AI risk?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We begin with a review of data, access, and tool requirements. We minimize permissions, prefer client-owned and business-grade accounts, define what information may or may not be sent to AI systems, document human-review requirements, and scope any industry-specific security or compliance needs before implementation."
            }
          },
          {
            "@type": "Question",
            "name": "How do you measure whether the work is valuable?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We establish a baseline and success measures before implementation. Depending on the workflow, that may include time saved, cycle time, response speed, conversion, cost per task, backlog, error or rework rate, team adoption, customer satisfaction, or incremental revenue."
            }
          },
          {
            "@type": "Question",
            "name": "How much does it cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The AI Opportunity Audit starts at $2,500 for one clearly bounded business area. Team enablement starts at $5,000, focused AI builds at $8,000, implementation sprints at $20,000, and substantial custom systems at $40,000. Final scope and pricing are confirmed before work begins."
            }
          },
          {
            "@type": "Question",
            "name": "How long does it take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A focused AI Opportunity Audit typically takes 7 to 10 business days after the necessary interviews and access are scheduled. Enablement and build timelines depend on scope and are confirmed in a written Statement of Work before work begins."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide ongoing support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. AI Operating Partner engagements can include continued training, new workflow implementation, system monitoring, evaluation, governance updates, cost control, maintenance, and ongoing optimization."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
